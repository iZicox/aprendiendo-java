<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function iniciar() {
            let listarTodos = crearBoton('listar elementos');
            document.body.appendChild(listarTodos);
            listarTodos.onclick = () => {

                console.log('click');

                fetch("http://localhost:8080/api/productos")
                    .then(response => response.json())
                    .then(data => {
                        console.log(data);
                        if (!data || data.length === 0) {
                            console.log('no hay datos');
                            return;
                        }

                        let contenedor = document.getElementById('datos');

                        // limpiar contenido anterior
                        contenedor.innerHTML = '';

                        let tabla = document.createElement('table');
                        tabla.setAttribute('border', '1');

                        // encabezado
                        let headerTabla = document.createElement('tr');

                        let colNombre = document.createElement('th');
                        colNombre.innerText = 'nombre';
                        headerTabla.appendChild(colNombre);

                        let colPrecio = document.createElement('th');
                        colPrecio.innerText = 'precio';
                        headerTabla.appendChild(colPrecio);

                        tabla.appendChild(headerTabla);

                        // filas
                        for (const obj of data) {

                            let fila = document.createElement('tr');

                            let nombre = document.createElement('td');
                            nombre.innerText = obj.nombre;
                            fila.appendChild(nombre);

                            let precio = document.createElement('td');
                            precio.innerText = obj.precio;
                            fila.appendChild(precio);

                            tabla.appendChild(fila);
                        }

                        contenedor.appendChild(tabla);
                    })
                    .catch(error => {
                        console.error('Error:', error);
                    });
            };

            let divDatos = document.createElement('div');
            divDatos.id = 'datos';
            document.body.appendChild(divDatos);
        }

        function crearBoton(inner) {
            let boton = document.createElement('button');
            boton.innerText = inner;
            return boton;
        }
        window.onload = iniciar;
    </script>
</head>

<body>

</body>

</html>
