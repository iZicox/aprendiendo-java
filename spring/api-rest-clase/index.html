<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>

        const urlApi = 'http://localhost:8080/api/v1/productos';

        function iniciar() {

            let inputId = crearInput('id: ', 'text', 'inputId', 'escribe el id');
            document.body.appendChild(inputId);
            document.body.appendChild(document.createElement('br'));
            document.body.appendChild(document.createElement('br'));

            let inputNombre = crearInput('nombre: ', 'text', 'inputNombre', 'escribe el nombre');
            document.body.appendChild(inputNombre);
            document.body.appendChild(document.createElement('br'));
            document.body.appendChild(document.createElement('br'));

            let inputPrecio = crearInput('precio: ', 'text', 'inputPrecio', 'escribe el precio');
            document.body.appendChild(inputPrecio);
            document.body.appendChild(document.createElement('br'));
            document.body.appendChild(document.createElement('br'));

            let listarTodos = crearBoton('listar elementos');
            document.body.appendChild(listarTodos);
            listarTodos.onclick = () => {

                console.log('click');

                fetch(urlApi)
                    .then(response => response.json())
                    .then(data => {
                        console.log(data);
                        if (!data || data.length === 0) {
                            console.log('no hay datos');
                            return;
                        }

                        let contenedor = document.getElementById('datos');

                        // limpiar contenido anterior
                        contenedor.innerHTML = '';

                        let tabla = document.createElement('table');
                        tabla.setAttribute('border', '1');

                        // encabezado
                        let headerTabla = document.createElement('tr');

                        let colId = document.createElement('th');
                        colId.innerText = 'id';
                        headerTabla.appendChild(colId);

                        let colNombre = document.createElement('th');
                        colNombre.innerText = 'nombre';
                        headerTabla.appendChild(colNombre);

                        let colPrecio = document.createElement('th');
                        colPrecio.innerText = 'precio';
                        headerTabla.appendChild(colPrecio);

                        tabla.appendChild(headerTabla);

                        data.sort((a, b) => a.id - b.id);

                        // filas
                        for (const obj of data) {

                            let fila = document.createElement('tr');

                            let id = document.createElement('td');
                            id.innerText = obj['id'];
                            fila.appendChild(id);

                            let nombre = document.createElement('td');
                            nombre.innerText = obj.nombre;
                            fila.appendChild(nombre);

                            let precio = document.createElement('td');
                            precio.innerText = obj.precio;
                            fila.appendChild(precio);

                            tabla.appendChild(fila);
                        }

                        contenedor.appendChild(tabla);
                    })
                    .catch(error => {
                        console.error('Error:', error);
                    });
            };

            let crear = crearBoton('crear nuevo');
            document.body.appendChild(crear);
            crear.onclick = () => {
                console.log('click crear');

                let contenedor = document.getElementById('datos');
                contenedor.innerHTML = '';

                let nombre = document.getElementById('inputNombre').value;
                let precio = Number.parseFloat(document.getElementById('inputPrecio').value);

                console.log(precio);
                console.log(nombre);

                if (!nombre || nombre.length === 0) {
                    contenedor.innerText = 'campo de nombre vacio'
                    return;
                }



                if (!precio || precio <= 0) {
                    contenedor.innerText = 'campo de precio vacio'
                    return;
                }

                fetch(urlApi, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        "nombre": nombre,
                        "precio": precio
                    })
                })
                    .then(res => res.json())
                    .then(data => {


                        if (!data || data.length === 0) {
                            contenedor.innerText = 'error al crear'
                            return;
                        }

                        contenedor.innerText = 'elemento nuevo creado con id: ' + data.id;


                    })
            }


            let eliminarPorId = crearBoton('eliminar por id');
            document.body.appendChild(eliminarPorId);
            eliminarPorId.onclick = () => {
                let id = Number.parseFloat(document.getElementById('inputId').value);
                let contenedor = document.getElementById('datos');
                contenedor.innerHTML = '';
                if (!id || id <= 0) {
                    contenedor.innerText = 'ingresa un id valido';
                    return;
                }

                fetch(urlApi + '/' + id, {
                    method: "DELETE"
                })
                    .then(res => {
                        if (!res.ok) {
                            throw new Error("id no encontrado");
                        }
                        return res.json()
                    })
                    .then(data => {
                        if (!data || data.length === 0) {
                            contenedor.innerText = 'error al eliminar'
                            return;
                        }

                        contenedor.innerText = 'elemento eliminado';
                        contenedor.innerHTML += "<ul>";
                        for (const clave in data) {
                            contenedor.innerHTML += `<li>${clave}: ${data[clave]}</li>`;
                        }
                        contenedor.innerHTML += "</ul>";
                    })
                    .catch(error => {
                        contenedor.innerText = error.message;
                        console.log(error);
                    })
            }


            let buscarPorId = crearBoton('buscar por id');
            document.body.appendChild(buscarPorId);
            buscarPorId.onclick = () => {
                let idBuscado = Number.parseFloat(document.getElementById('inputId').value);
                let contenedor = document.getElementById('datos');
                contenedor.innerHTML = '';
                if (!idBuscado || idBuscado <= 0) {
                    contenedor.innerText = 'ingresa un id valido';
                    return;
                }

                fetchBuscarId(idBuscado);
            }

            let actualizar = crearBoton('actualizar');
            document.body.appendChild(actualizar);
            actualizar.onclick = () => {

                let contenedor = document.getElementById('datos');
                contenedor.innerHTML = '';

                let idBuscado = Number.parseInt(document.getElementById('inputId').value);

                let nuevoNombre = document.getElementById('inputNombre').value;

                let nuevoPrecio = Number.parseFloat(document.getElementById('inputPrecio').value);

                let antiguo = existeGet(urlApi + '/' + idBuscado);

                if(!antiguo || antiguo.length === 0){
                    contenedor.innerText = 'id no encontrado'
                }

                if(!nuevoNombre || nuevoNombre.length === 0){
                    nuevoNombre = antiguo.nombre;
                }

                if(!nuevoPrecio || nuevoPrecio <= 0){
                    nuevoPrecio = antiguo.precio;
                }


                fetch(urlApi + '/' + idBuscado, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        "nombre": nuevoNombre,
                        "precio": nuevoPrecio
                    })
                })
                    .then(res => {
                        if (!res.ok) {
                            throw new Error('Error al actualizar');
                        }
                        return res.json();
                    })
                    .then(data => {

                        contenedor.innerHTML += 'id actualizado: ' + data.id;
                        contenedor.innerHTML += `<ul>`;
                        for (const key in data) {
                            contenedor.innerHTML += `<li>`;
                            contenedor.innerHTML += `${key}: ${data[key]}`;
                            contenedor.innerHTML += `</li>`;
                        }
                        contenedor.innerHTML += `</ul>`;

                    })
                    .catch(error => {
                        contenedor.innerText = error.message;
                    })
            }

            let botonLimpiarCampos = crearBoton('limpiar campos');
            document.body.appendChild(botonLimpiarCampos);
            botonLimpiarCampos.onclick = () => {
                let nodos = document.querySelectorAll('input');

                [...nodos].map((e) => e.value = '');
            }

            let divDatos = document.createElement('div');
            divDatos.id = 'datos';
            document.body.appendChild(divDatos);
        }

        function crearInput(campo, tipo, id, placeholder) {
            let label = document.createElement('label');
            label.innerText = campo;
            let input = document.createElement('input');
            input.type = tipo;
            input.id = id;
            input.placeholder = placeholder;

            label.appendChild(input);

            return label;

        }

        async function existeGet(urlGet) {
            return await fetch(urlGet)
                .then( res => {
                    if(!res.ok){
                        throw new Error('id no encontrado');
                    }
                    return res.json();
                })
                .then(data => {
                    if(!data || data.length === 0){
                        throw new Error('id no encontrado');
                    }
                    return data;
                });
        }

        function fetchBuscarId(id) {
            fetch(urlApi + '/' + id)
                .then(res => {
                    if (!res.ok) {
                        throw new Error('id no encontrado')
                    }
                    return res.json();
                })
                .then(data => {
                    console.log(data);
                    let contenedor = document.getElementById('datos');
                    contenedor.innerHTML = '';

                    contenedor.innerHTML += '<p>elemento buscado</p>';
                    contenedor.innerHTML += '<ul>';
                    for (const key in data) {
                        contenedor.innerHTML += `<li>${key}: ${data[key]}</li>`;
                    }
                    contenedor.innerHTML += '</ul>';
                })
                .catch(error => {
                    let contenedor = document.getElementById('datos');
                    contenedor.innerText = error.message;
                    console.log(error);
                });
        }

        function crearBoton(inner) {
            let boton = document.createElement('button');
            boton.innerText = inner;
            return boton;
        }
        window.onload = iniciar;
    </script>
</head>

</body>

</html>
